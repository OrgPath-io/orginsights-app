<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Index</title>
    <!--[if lt IE 9]><script src="js/html5shiv.min.js"></script><![endif]-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="css/all.css" rel="stylesheet">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="images/apple-touch-icon-144-precomposed.png">
    <link rel="shortcut icon" href="images/favicon.png">

</head>

<body>

    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-md-4 col-sm-6 col-6 align-self-center"><a href="#"><img src="images/Orgpath-Final.png" alt=""></a></div>
                <div class="col-md-4 col-sm-12 col-12 align-self-center d-none d-md-block">Welcome back <strong>Shahid</strong></div>
                <div class="col-md-4 col-sm-6 col-6 align-self-center">
                    <ul>
                        <li><a href="#"><img src="images/search.jpg" alt=""></a></li>
                        <li><a href="#"><img src="images/phone.jpg" alt=""></a></li>
                        <li><a href="#"><img src="images/user.jpg" alt=""></a></li>
                    </ul>
                </div>
                <div class="col-md-4 col-sm-12 col-12 align-self-center d-block d-md-none">Welcome back <strong>Shahid</strong></div>
            </div>
        </div>
    </header>

    <div class="page-banner">
        <div class="container clearfix">
            <h1>Register</h1>
        </div>
    </div>

    <div class="section">
        <div class="container">
            <div class="register-column">
                <div class="row">
                    <div class="col-md-7">
                        <div class="register-form">
                            <div class="common-form">
                                <form>
                                    <div class="form-heading text-center">
                                        <h4>Enter your details</h4>
                                        <p>We dont use your details for marketing purposes</p>
                                    </div>
                                    <div class="form-group">
                                        <label>First Name</label>
                                        <div class="req-icon-col">
                                            <input type="text" class="form-control" placeholder="First Name">
                                            <span class="req-icon">*</span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Last Name</label>
                                        <div class="req-icon-col">
                                            <input type="text" class="form-control" placeholder="Last Name">
                                            <span class="req-icon">*</span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Email Address</label>
                                        <div class="req-icon-col">
                                            <input type="email" class="form-control" placeholder="Enter your email address">
                                            <span class="req-icon">*</span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Password</label>
                                        <div class="req-icon-col">
                                            <input type="text" class="form-control" placeholder="Enter 6 digit password">
                                            <span class="req-icon">*</span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Confirm Password</label>
                                        <div class="req-icon-col">
                                            <input type="text" class="form-control" placeholder="Confirm Password">
                                            <span class="req-icon">*</span>
                                        </div>
                                    </div>
                                    <div class="form-group text-center">
                                        <button type="submit" class="btn btn-secondary btn-style-2">REGISTER NOW</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 offset-lg-1 col-md-5 offset-md-0 gift-card-main">
                        <div class="gift-card-col">
                            <p>Complete the registeration and get a gift card</p>
                            <img src="images/amazon-gift-img.png" class="img-fluid">
                            <div class="custom-progress-bar yellow-progress-bar">
                                <p>You are almost there to win our gift card</p>
                                <div class="progress">
                                    <div class="progress-bar" role="progressbar" style="width: 60%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="60"></div>
                                    <div class="total-progress-count">$</div>
                                </div>
                                <div class="complete-text text-center">
                                    <p>60% Complete</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <footer class="footer">
        <div class="container">&copy; Copyrights 2020 Orgapath. All Rights Reserved</div>
    </footer>

    <!-- Bootstrap core JavaScript================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="js/jquery-min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/ie10-viewport-bug-workaround.js"></script>
    <script src="js/ie-emulation-modes-warning.js"></script>
    <script src="js/custom.js"></script>
    <script src="js/jquery.matchHeight-min.js"></script>
    <script type="text/javascript">
        jQuery('.coleql_height').matchHeight();

    </script>
</body>

</html>
